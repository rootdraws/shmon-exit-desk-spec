<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="880" viewBox="0 0 1280 880" role="img" aria-label="Who controls the two shMON vaults: one admin key behind a one-of-one Safe controls every contract on Monad and owns both hedge Safes on HyperEVM; the server's executor keys move money inside the strategies and the hedges; the oracle keys publish NAV; the guardian key pauses; the deployer key governs the Euler cluster; the keeper key fills the digester, runs the shMON arbitrage and runs the exit bid pools." style="color:#17201f">
    <rect x="0" y="0" width="1280" height="880" fill="#f6f5f1"/>
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#17201f"/></marker>
      <marker id="arrow-admin" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a2b2b"/></marker>
      <marker id="arrow-bot" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0a5f8f"/></marker>
    </defs>
    <g font-family="IBM Plex Sans, system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#17201f">

      <!-- arrows first, so every box sits on top of them -->
      <g id="lines">
        <line x1="165" y1="132" x2="165" y2="212" stroke="#8a2b2b" stroke-width="2" marker-end="url(#arrow-admin)"/>
        <line x1="320" y1="262" x2="358" y2="262" stroke="#8a2b2b" stroke-width="2" marker-end="url(#arrow-admin)"/>
        <path d="M190,310 V330" fill="none" stroke="#8a2b2b" stroke-width="2" marker-end="url(#arrow-admin)"/>
        <path d="M100,386 V790 H358" fill="none" stroke="#8a2b2b" stroke-width="2" marker-end="url(#arrow-admin)"/>
        <path d="M100,568 H358" fill="none" stroke="#8a2b2b" stroke-width="2" marker-end="url(#arrow-admin)"/>
        <path d="M100,694 H358" fill="none" stroke="#8a2b2b" stroke-width="2" marker-end="url(#arrow-admin)"/>
        <path d="M700,132 V212" fill="none" stroke="#0a5f8f" stroke-width="2" marker-end="url(#arrow-bot)"/>
        <path d="M860,132 V694 H832" fill="none" stroke="#0a5f8f" stroke-width="2" marker-end="url(#arrow-bot)"/>
        <path d="M410,132 V392" fill="none" stroke="#17201f" marker-end="url(#arrow)"/>
        <path d="M830,300 H898" fill="none" stroke="#0a5f8f" stroke-width="2" marker-end="url(#arrow-bot)"/>
        <path d="M830,318 H870 V470 H898" fill="none" stroke="#0a5f8f" stroke-width="2" marker-end="url(#arrow-bot)"/>
        <path d="M1040,574 V546" fill="none" stroke="#8a2b2b" stroke-width="2" marker-end="url(#arrow-admin)"/>
        <path d="M1182,622 H1222 V290 H1184" fill="none" stroke="#8a2b2b" stroke-width="2" marker-end="url(#arrow-admin)"/>
      </g>

      <!-- row 1: the keys and where they live -->
      <text x="40" y="30" font-weight="600" font-size="13">Who holds each key</text>

      <rect x="40" y="44" width="250" height="88" rx="3" fill="#f3e1e1" stroke="#8a2b2b" stroke-width="2"/>
      <text x="56" y="66" font-weight="600">custody-admin key</text>
      <text x="56" y="84" fill="#5f6b69">It sits on Root's Mac.</text>
      <text x="56" y="102" font-family="IBM Plex Mono, Menlo, monospace" font-size="11">0xb9a8…681B</text>
      <text x="56" y="120" fill="#5f6b69">It alone owns the admin Safe.</text>

      <rect x="310" y="44" width="200" height="88" rx="3" fill="#ffffff" stroke="#17201f"/>
      <text x="326" y="66" font-weight="600">dev deployer key</text>
      <text x="326" y="84" fill="#5f6b69">It sits on Root's Mac.</text>
      <text x="326" y="102" font-family="IBM Plex Mono, Menlo, monospace" font-size="11">0x5011…0253</text>
      <text x="326" y="120" fill="#5f6b69">It runs the Euler cluster.</text>

      <rect x="530" y="44" width="330" height="88" rx="3" fill="#dfeaf2" stroke="#0a5f8f" stroke-width="2"/>
      <text x="546" y="66" font-weight="600">Server keys (3.211.84.65)</text>
      <text x="546" y="84" fill="#5f6b69" font-size="11">Two executors, two oracles, a guardian and a keeper.</text>
      <text x="546" y="102" fill="#5f6b69">The server holds only these six keys.</text>
      <text x="546" y="120" fill="#5f6b69">It holds no Hyperliquid key and no admin key.</text>

      <rect x="880" y="44" width="320" height="88" rx="3" fill="#ffffff" stroke="#8a948f" stroke-dasharray="5 4"/>
      <text x="896" y="66" font-weight="600" fill="#5f6b69">AlphaGrowth Euler Safe</text>
      <text x="896" y="84" fill="#5f6b69" font-family="IBM Plex Mono, Menlo, monospace" font-size="11">0x4f89…Fd3C · theirs</text>
      <text x="896" y="102" fill="#5f6b69">It receives 10% of the cluster's interest.</text>
      <text x="896" y="120" fill="#5f6b69">It governs the first cluster, which is empty.</text>

      <!-- labels on lines -->
      <text x="176" y="154" fill="#8a2b2b" font-size="11">It signs for the Safe.</text>
      <text x="712" y="154" fill="#0a5f8f" font-size="11">Three keys act here.</text>
      <text x="420" y="384" fill="#5f6b69" font-size="11">It governs.</text>
      <text x="866" y="600" fill="#0a5f8f" font-size="10" text-anchor="middle" transform="rotate(90 866 600)">The keeper acts.</text>
      <text x="1050" y="564" fill="#8a2b2b" font-size="11">It owns both.</text>

      <!-- Monad side -->
      <rect x="40" y="170" width="810" height="690" rx="4" fill="none" stroke="#17201f" stroke-dasharray="6 4"/>
      <text x="56" y="194" font-weight="600" font-size="13">Monad</text>

      <rect x="60" y="214" width="260" height="96" rx="3" fill="#f3e1e1" stroke="#8a2b2b" stroke-width="2"/>
      <text x="76" y="236" font-weight="600">Admin Safe, 1 of 1</text>
      <text x="76" y="254" font-family="IBM Plex Mono, Menlo, monospace" font-size="11">0xC94d…9CfD</text>
      <text x="76" y="272" fill="#5f6b69">It upgrades contracts and sets fees.</text>
      <text x="76" y="290" fill="#5f6b69">It can halt, withdraw and open pools.</text>

      <rect x="60" y="330" width="260" height="56" rx="3" fill="#ffffff" stroke="#17201f"/>
      <text x="76" y="352" font-weight="600">Freeze module on the Safe</text>
      <text x="76" y="370" fill="#5f6b69">The guardian can halt through it.</text>

      <rect x="360" y="214" width="470" height="150" rx="3" fill="#ffffff" stroke="#17201f"/>
      <text x="376" y="236" font-weight="600">Two vault stacks: Delta One and Delta Neutral</text>
      <text x="376" y="256" fill="#5f6b69">Each has a vault, controller, settings, withdrawals and two desks.</text>
      <text x="376" y="282" font-weight="600" font-size="11">admin</text>
      <text x="450" y="282" fill="#5f6b69">The admin Safe controls every contract.</text>
      <text x="376" y="300" font-weight="600" font-size="11">executor</text>
      <text x="450" y="300" fill="#5f6b69">One key per vault supplies, borrows, repays and swaps.</text>
      <text x="450" y="316" fill="#5f6b69">It also pays leavers, runs the desks and moves margin.</text>
      <text x="376" y="334" font-weight="600" font-size="11">oracle</text>
      <text x="450" y="334" fill="#5f6b69">One key per vault publishes the share price.</text>
      <text x="376" y="352" font-weight="600" font-size="11">guardian</text>
      <text x="450" y="352" fill="#5f6b69">One key pauses and halts. Each delta is fixed.</text>

      <rect x="360" y="394" width="470" height="96" rx="3" fill="#ffffff" stroke="#17201f"/>
      <text x="376" y="416" font-weight="600">Euler cluster: a router and shMON, USDC, USDT0, WMON vaults</text>
      <text x="376" y="436" fill="#5f6b69">The dev deployer sets prices, caps and loan lines.</text>
      <text x="376" y="454" fill="#5f6b69">The AlphaGrowth Safe receives 10% of the interest.</text>
      <text x="376" y="472" fill="#5f6b69">The dev deployer is the only lender, with 929.88 WMON.</text>

      <rect x="360" y="520" width="470" height="96" rx="3" fill="#ffffff" stroke="#17201f"/>
      <text x="376" y="542" font-weight="600">ushMON 0xa753…8C5e and the two EulerSwap pools</text>
      <text x="376" y="562" fill="#5f6b69">The two exit desks are its only operators.</text>
      <text x="376" y="580" fill="#5f6b69">Each pool trades from its own desk's account.</text>
      <text x="376" y="598" fill="#5f6b69">The admin Safe opens pools. The executor parks and borrows.</text>

      <rect x="360" y="646" width="470" height="96" rx="3" fill="#ffffff" stroke="#17201f"/>
      <text x="376" y="668" font-weight="600">Digester router v2 and the two exit bid pools</text>
      <text x="376" y="688" fill="#5f6b69">The keeper owns the router and fills orders through it.</text>
      <text x="376" y="706" fill="#5f6b69">The admin Safe sets each bid pool's discount and keeper.</text>
      <text x="376" y="724" fill="#5f6b69">The keeper bids and unstakes but never holds the money.</text>

      <rect x="360" y="772" width="470" height="56" rx="3" fill="#ffffff" stroke="#17201f"/>
      <text x="376" y="794" font-weight="600">Bridge whitelist</text>
      <text x="376" y="812" fill="#5f6b69">Each vault can bridge only to its own hedge Safe.</text>

      <!-- Hyperliquid side -->
      <rect x="880" y="170" width="360" height="690" rx="4" fill="none" stroke="#17201f" stroke-dasharray="6 4"/>
      <text x="896" y="194" font-weight="600" font-size="13">Hyperliquid</text>

      <rect x="900" y="214" width="280" height="150" rx="3" fill="#ffffff" stroke="#17201f"/>
      <text x="916" y="236" font-weight="600">Hedge Safe, Delta One</text>
      <text x="916" y="254" font-family="IBM Plex Mono, Menlo, monospace" font-size="11">0x704f…C6ed · 1 of 1</text>
      <text x="916" y="272" fill="#5f6b69">The admin Safe owns it.</text>
      <text x="916" y="290" fill="#5f6b69">The executor may move margin and trade.</text>
      <text x="916" y="308" fill="#5f6b69">Its Roles module allows nothing else.</text>
      <text x="916" y="326" fill="#5f6b69" font-size="11">API wallet AS_SHMON_USDC ends Jan 2027.</text>
      <text x="916" y="344" fill="#5f6b69">It holds $1.50 on Hyperliquid.</text>

      <rect x="900" y="394" width="280" height="150" rx="3" fill="#ffffff" stroke="#17201f"/>
      <text x="916" y="416" font-weight="600">Hedge Safe, Delta Neutral</text>
      <text x="916" y="434" font-family="IBM Plex Mono, Menlo, monospace" font-size="11">0x213a…61C3 · 1 of 1</text>
      <text x="916" y="452" fill="#5f6b69">The admin Safe owns it.</text>
      <text x="916" y="470" fill="#5f6b69">The executor may move margin and trade.</text>
      <text x="916" y="488" fill="#5f6b69">Its Roles module allows nothing else.</text>
      <text x="916" y="506" fill="#5f6b69" font-size="11">API wallet AS_SHMUSDC_D0 ends Jan 2027.</text>
      <text x="916" y="524" fill="#5f6b69">It holds $0.15 on Hyperliquid.</text>

      <rect x="900" y="574" width="280" height="96" rx="3" fill="#f3e1e1" stroke="#8a2b2b" stroke-width="2"/>
      <text x="916" y="596" font-weight="600">Admin Safe on HyperEVM</text>
      <text x="916" y="614" font-family="IBM Plex Mono, Menlo, monospace" font-size="11">0xC94d…9CfD · same address · 1 of 1</text>
      <text x="916" y="632" fill="#5f6b69">The custody-admin key owns it.</text>
      <text x="916" y="650" fill="#5f6b69">It can act for either hedge Safe.</text>

    </g>
</svg>
