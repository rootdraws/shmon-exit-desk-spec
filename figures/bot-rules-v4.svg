<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="982" viewBox="0 0 1320 982" role="img" aria-label="The bot's loan-to-value lines, the order it tries steps each tick, and its rules for growing, the Hyperliquid short, unwinding, and paying leavers." style="color:#17201f">
    <rect x="0" y="0" width="1320" height="982" fill="#f6f5f1"/>
    <g font-family="IBM Plex Sans, system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#17201f">
      <text x="40" y="30" font-weight="600" font-size="13">Loan-to-value lines</text>
      <rect x="40" y="44" width="420" height="464" rx="3" fill="#ffffff" stroke="#17201f"/>
      <text x="56" y="64" font-weight="600" font-size="11" fill="#5f6b69">Euler</text><text x="124" y="64" font-weight="600" font-size="11" fill="#5f6b69">Neverland</text>
        <text x="56" y="92" font-weight="600" fill="#8a2b2b">80%</text><text x="124" y="92" font-weight="600" fill="#8a2b2b">70%</text>
      <text x="192" y="92">Liquidation threshold.</text>
        <text x="56" y="124" font-weight="600" fill="#8a2b2b">76%</text><text x="124" y="124" font-weight="600" fill="#8a2b2b">66.5%</text>
      <text x="192" y="124">The monitor pauses the vault here.</text>
      <text x="192" y="142" fill="#5f6b69">Taker sales keep running while paused.</text>
        <text x="56" y="174" font-weight="600" fill="#8a2b2b">74.28%</text><text x="124" y="174" font-weight="600" fill="#8a2b2b">65%</text>
      <text x="192" y="174">Taker sales start here.</text>
      <text x="192" y="192" fill="#5f6b69">They run down to the taker-stop line.</text>
        <text x="56" y="224" font-weight="600" fill="#8a2b2b">68.57%</text><text x="124" y="224" font-weight="600" fill="#8a2b2b">60%</text>
      <text x="192" y="224">The controlled unwind starts here.</text>
        <text x="56" y="256" font-weight="600" fill="#8a2b2b">62.85%</text><text x="124" y="256" font-weight="600" fill="#8a2b2b">55%</text>
      <text x="192" y="256">Taker sales stop here.</text>
      <text x="192" y="274" fill="#5f6b69">Above it, the short's profit repays the loan.</text>
      <text x="192" y="292" fill="#5f6b69">Hedge margin can borrow up to here.</text>
        <text x="56" y="324" font-weight="600" fill="#5f6b69">60%</text><text x="124" y="324" font-weight="600" fill="#5f6b69">52.5%</text>
      <text x="192" y="324">The unwind stops here.</text>
      <text x="192" y="342" fill="#5f6b69">Patient sales and repays run down to it.</text>
      <text x="192" y="360" fill="#5f6b69">The monitor unpauses here.</text>
        <text x="56" y="392" font-weight="600" fill="#17201f">51.42%</text><text x="124" y="392" font-weight="600" fill="#17201f">45%</text>
      <text x="192" y="392">Growth borrows up to here.</text>
        <text x="56" y="424" font-weight="600" fill="#0a7f6a">49.14%</text><text x="124" y="424" font-weight="600" fill="#0a7f6a">43%</text>
      <text x="192" y="424">Target LTV.</text>
        <text x="56" y="456" font-weight="600" fill="#0a7f6a">48%</text><text x="124" y="456" font-weight="600" fill="#0a7f6a">42%</text>
      <text x="192" y="456">The first build stops here.</text>
        <text x="56" y="488" font-weight="600" fill="#0a7f6a">37.71%</text><text x="124" y="488" font-weight="600" fill="#0a7f6a">33%</text>
      <text x="192" y="488">Below this, the bot borrows back to target.</text>
      <g transform="translate(80,0)">
      <text x="420" y="30" font-weight="600" font-size="13">Each tick, the bot takes the first step with work.</text>
      <rect x="420" y="44" width="400" height="172" rx="3" fill="#ffffff" stroke="#17201f"/>
      <text x="436" y="68" font-weight="600">0. First, the bot finishes any Hyperliquid margin transfer.</text>
      <text x="436" y="88" font-weight="600">Then it reads the vault's mode.</text>
      <text x="436" y="106" fill="#5f6b69">•</text><text x="448" y="106" fill="#5f6b69"><tspan font-weight="600" fill="#17201f">Halted:</tspan> The admin Safe stopped it. The bot does nothing.</text>
      <text x="436" y="124" fill="#5f6b69">•</text><text x="448" y="124" fill="#5f6b69"><tspan font-weight="600" fill="#17201f">Paused:</tspan> The bot repays, sells and adds deposits as collateral.</text>
      <text x="436" y="142" fill="#5f6b69">•</text><text x="448" y="142" fill="#5f6b69"><tspan font-weight="600" fill="#17201f">Stale data:</tspan> The bot stops growth, new shorts and payouts.</text>
      <text x="448" y="160" fill="#5f6b69">–</text><text x="460" y="160" fill="#5f6b69">A block 60 s old or a price 90 min old is stale.</text>
      <text x="448" y="178" fill="#5f6b69">–</text><text x="460" y="178" fill="#5f6b69">A Hyperliquid outage also counts as stale.</text>
      <text x="436" y="196" fill="#5f6b69">•</text><text x="448" y="196" fill="#5f6b69"><tspan font-weight="600" fill="#17201f">Withdrawing:</tspan> The bot pays waiting leavers and does not grow.</text>
      <g font-size="11.5">
        <rect x="420" y="230" width="400" height="26" rx="2" fill="#ffffff" stroke="#8a948f"/><text x="434" y="247">1. The exit desk and the stable desk take their step.</text>
        <rect x="420" y="262" width="400" height="26" rx="2" fill="#f3e1e1" stroke="#8a2b2b"/><text x="434" y="279">2. Over 55%, the short's profit and spare margin repay.</text>
        <rect x="420" y="294" width="400" height="26" rx="2" fill="#f3e1e1" stroke="#8a2b2b"/><text x="434" y="311">3. It sells as a taker from 65%, or unwinds from 60%.</text>
        <rect x="420" y="326" width="400" height="26" rx="2" fill="#ffffff" stroke="#8a948f"/><text x="434" y="343">4. The bot sweeps bridge refunds, harvests and conversions.</text>
        <rect x="420" y="358" width="400" height="26" rx="2" fill="#dfeaf2" stroke="#0a5f8f"/><text x="434" y="375">5. If the short is over 1% too small, a maker order adds to it.</text>
        <rect x="420" y="390" width="400" height="26" rx="2" fill="#ffffff" stroke="#8a948f"/><text x="434" y="407">6. Deposits settle, stable debt moves, and leavers get paid.</text>
        <rect x="420" y="422" width="400" height="26" rx="2" fill="#dfeaf2" stroke="#0a5f8f"/><text x="434" y="439">7. The short is trimmed and its margin synced.</text>
        <rect x="420" y="454" width="400" height="26" rx="2" fill="#ffffff" stroke="#8a948f"/><text x="434" y="471">8. The bot takes profit, sells for margin, and rebalances.</text>
        <rect x="420" y="486" width="400" height="26" rx="2" fill="#d9efe9" stroke="#0a7f6a"/><text x="434" y="503">9. The bot balances lenders, moves debt, sweeps and grows.</text>
      </g>
      <rect x="420" y="520" width="400" height="46" rx="3" fill="#ffffff" stroke="#8a948f" stroke-dasharray="5 4"/>
      <text x="436" y="540" fill="#5f6b69" font-size="11.5">•</text><text x="448" y="540" fill="#5f6b69" font-size="11.5">A refused desk step waits 5 minutes.</text>
      <text x="436" y="556" fill="#5f6b69" font-size="11.5">•</text><text x="448" y="556" fill="#5f6b69" font-size="11.5">A failed loan bundle blocks bundles for 15 minutes.</text>
      <rect x="420" y="584" width="400" height="208" rx="3" fill="#ffffff" stroke="#17201f"/>
      <text x="436" y="608" font-weight="600">Pause and prices</text>
      <text x="436" y="628" fill="#5f6b69">•</text><text x="448" y="628" fill="#5f6b69">When paused, the bot still repays, sells, hedges and settles.</text>
      <text x="436" y="646" fill="#5f6b69">•</text><text x="448" y="646" fill="#5f6b69">Paused, it takes deposits but cannot borrow or pay leavers.</text>
      <text x="436" y="664" fill="#5f6b69">•</text><text x="448" y="664" fill="#5f6b69">The monitor pauses the vault at 66.5%.</text>
      <text x="436" y="682" fill="#5f6b69">•</text><text x="448" y="682" fill="#5f6b69">It unpauses after 30 min at or under 52.5%.</text>
      <text x="436" y="700" fill="#5f6b69">•</text><text x="448" y="700" fill="#5f6b69">A manual pause stays until someone lifts it.</text>
      <text x="436" y="718" fill="#5f6b69">•</text><text x="448" y="718" fill="#5f6b69">The share price moves at most 3% an hour in its own unit.</text>
      <text x="436" y="736" fill="#5f6b69">•</text><text x="448" y="736" fill="#5f6b69">The oracle posts every 30 min, or on a 1% move.</text>
      <text x="436" y="754" fill="#5f6b69">•</text><text x="448" y="754" fill="#5f6b69">Delta Neutral posts on a 0.2% move instead.</text>
      <text x="436" y="772" fill="#5f6b69">•</text><text x="448" y="772" fill="#5f6b69">An empty vault ticks every 5 min and posts every 2 h.</text>
      <text x="860" y="30" font-weight="600" font-size="13">The rules</text>
      <rect x="860" y="44" width="340" height="208" rx="3" fill="#d9efe9" stroke="#0a7f6a" stroke-width="2"/>
      <text x="876" y="68" font-weight="600">Opening and growing</text>
      <text x="876" y="88" fill="#5f6b69">•</text><text x="888" y="88" fill="#5f6b69">The first build takes the loan to 42% in one go.</text>
      <text x="876" y="106" fill="#5f6b69">•</text><text x="888" y="106" fill="#5f6b69">Under 33%, the bot borrows back to 43%.</text>
      <text x="876" y="124" fill="#5f6b69">•</text><text x="888" y="124" fill="#5f6b69">Idle shMON over $1 also starts a borrow.</text>
      <text x="876" y="142" fill="#5f6b69">•</text><text x="888" y="142" fill="#5f6b69">It borrows only what lenders hold before the kink.</text>
      <text x="876" y="160" fill="#5f6b69">•</text><text x="888" y="160" fill="#5f6b69">It uses USDT0 when cheaper, in $10,000 chunks.</text>
      <text x="876" y="178" fill="#5f6b69">•</text><text x="888" y="178" fill="#5f6b69">It skips a loop under $10 or over 0.35% in costs.</text>
      <text x="876" y="196" fill="#5f6b69">•</text><text x="888" y="196" fill="#5f6b69">It skips a loop that pays back in over 10 days.</text>
      <text x="876" y="214" fill="#5f6b69">•</text><text x="888" y="214" fill="#5f6b69">Deposits wait for the next share price.</text>
      <text x="876" y="232" fill="#5f6b69">•</text><text x="888" y="232" fill="#5f6b69">Growth runs only in Normal mode, with shares out.</text>
      <rect x="860" y="268" width="340" height="226" rx="3" fill="#dfeaf2" stroke="#0a5f8f" stroke-width="2"/>
      <text x="876" y="292" font-weight="600">The short on Hyperliquid</text>
      <text x="876" y="312" fill="#5f6b69">•</text><text x="888" y="312" fill="#5f6b69">The short is shMON held less delta times equity.</text>
      <text x="876" y="330" fill="#5f6b69">•</text><text x="888" y="330" fill="#5f6b69">On Delta One it is 0.49 times equity at target.</text>
      <text x="876" y="348" fill="#5f6b69">•</text><text x="888" y="348" fill="#5f6b69">On Delta Neutral it is 1.15 times equity at target.</text>
      <text x="876" y="366" fill="#5f6b69">•</text><text x="888" y="366" fill="#5f6b69">Each vault's delta is fixed on chain.</text>
      <text x="876" y="384" fill="#5f6b69">•</text><text x="888" y="384" fill="#5f6b69">The bot resizes when off by 1% of equity and $10.</text>
      <text x="876" y="402" fill="#5f6b69">•</text><text x="888" y="402" fill="#5f6b69">Margin is 28.57% plus fees, with a 5% buffer.</text>
      <text x="876" y="420" fill="#5f6b69">•</text><text x="888" y="420" fill="#5f6b69">Margin tops up when it falls under 80% of need.</text>
      <text x="876" y="438" fill="#5f6b69">•</text><text x="888" y="438" fill="#5f6b69">Margin comes from cash, a loan to 55%, or a sale.</text>
      <text x="876" y="456" fill="#5f6b69">•</text><text x="888" y="456" fill="#5f6b69">After a cut, half the short reopens at +4%.</text>
      <text x="876" y="474" fill="#5f6b69">•</text><text x="888" y="474" fill="#5f6b69">The rest reopens at +8% or after 48 hours.</text>
      <rect x="860" y="510" width="340" height="190" rx="3" fill="#f3e1e1" stroke="#8a2b2b" stroke-width="2"/>
      <text x="876" y="534" font-weight="600">Unwinding</text>
      <text x="876" y="554" fill="#5f6b69">•</text><text x="888" y="554" fill="#5f6b69">Over 55%, the short's profit repays the loan first.</text>
      <text x="876" y="572" fill="#5f6b69">•</text><text x="888" y="572" fill="#5f6b69">From 65% down to 55%, the bot sells as a taker.</text>
      <text x="876" y="590" fill="#5f6b69">•</text><text x="888" y="590" fill="#5f6b69">First it borrows WMON and sells it on v4, then v3.</text>
      <text x="876" y="608" fill="#5f6b69">•</text><text x="888" y="608" fill="#5f6b69">Then the instant redemption, then Curve, within 1.5%.</text>
      <text x="876" y="626" fill="#5f6b69">•</text><text x="888" y="626" fill="#5f6b69">Each WMON sale fills at most 2% under the oracle.</text>
      <text x="876" y="644" fill="#5f6b69">•</text><text x="888" y="644" fill="#5f6b69">The controlled unwind sells from 60% to 59%.</text>
      <text x="876" y="662" fill="#5f6b69">•</text><text x="888" y="662" fill="#5f6b69">Each of its steps trims the short by up to a quarter.</text>
      <text x="876" y="680" fill="#5f6b69">•</text><text x="888" y="680" fill="#5f6b69">Euler liquidates at 80%, so it carries more loan.</text>
      <rect x="860" y="716" width="340" height="226" rx="3" fill="#f3e1e1" stroke="#8a2b2b" stroke-width="2"/>
      <text x="876" y="740" font-weight="600">Paying leavers</text>
      <text x="876" y="760" fill="#5f6b69">•</text><text x="888" y="760" fill="#5f6b69">The oldest batch is paid first.</text>
      <text x="876" y="778" fill="#5f6b69">•</text><text x="888" y="778" fill="#5f6b69">Idle shMON pays it when it covers the batch.</text>
      <text x="876" y="796" fill="#5f6b69">•</text><text x="888" y="796" fill="#5f6b69">Otherwise the bot cuts the loan and the short first.</text>
      <text x="876" y="814" fill="#5f6b69">•</text><text x="888" y="814" fill="#5f6b69">Then it sells on Curve, uses the desk, or sells shMON.</text>
      <text x="876" y="832" fill="#5f6b69">•</text><text x="888" y="832" fill="#5f6b69">All chain steps go out in one bundle.</text>
      <text x="876" y="850" fill="#5f6b69">•</text><text x="888" y="850" fill="#5f6b69">Curve takes any sale over $10 under 0.15% cost.</text>
      <text x="876" y="868" fill="#5f6b69">•</text><text x="888" y="868" fill="#5f6b69">A desk chunk is capped at 4 hours of sales.</text>
      <text x="876" y="886" fill="#5f6b69">•</text><text x="888" y="886" fill="#5f6b69">It is also capped at 92% of the lender's room.</text>
      <text x="876" y="904" fill="#5f6b69">•</text><text x="888" y="904" fill="#5f6b69">Any leftover under $1,000 is sold at market.</text>
      <text x="876" y="922" fill="#5f6b69">•</text><text x="888" y="922" fill="#5f6b69">Holders who stay keep the 0.30% exit fee.</text>
      </g>
    </g>
</svg>
