<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="790" viewBox="0 0 1320 790" role="img" aria-label="Our Euler cluster on Monad: a price router feeding four lending vaults; the WMON vault lends to the two exit desks against their ushMON vault; each desk owns an EulerSwap pool that buys shMON from anyone; the shMON unstakes through shMonad in a day. The first cluster, handed to AlphaGrowth, sits empty." style="color:#17201f">
    <rect x="0" y="0" width="1320" height="790" fill="#f6f5f1"/>
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
        <path d="M0,0 L10,5 L0,10 z" fill="#17201f"/>
      </marker>
      <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
        <path d="M0,0 L10,5 L0,10 z" fill="#0a7f6a"/>
      </marker>
    </defs>
    <g font-family="IBM Plex Sans, system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#17201f">

      <!-- prices -->
      <rect x="40" y="60" width="230" height="64" rx="3" fill="#ffffff" stroke="#17201f"/>
      <text x="56" y="84" font-weight="600">Chainlink SVR feeds</text>
      <text x="56" y="104" fill="#5f6b69">shMON/MON daily · MON/USD 2h</text>

      <line x1="155" y1="124" x2="155" y2="178" stroke="#17201f" marker-end="url(#arrow)"/>
      <text x="164" y="156" fill="#5f6b69">reads</text>

      <rect x="40" y="180" width="230" height="64" rx="3" fill="#ffffff" stroke="#17201f"/>
      <text x="56" y="204" font-weight="600">Price router</text>
      <text x="56" y="224" fill="#5f6b69" font-family="IBM Plex Mono, Menlo, monospace" font-size="11">0x99f7…2C32</text>

      <line x1="270" y1="212" x2="348" y2="212" stroke="#17201f" marker-end="url(#arrow)"/>
      <text x="282" y="204" fill="#5f6b69">prices</text>

      <!-- the first cluster, empty -->
      <rect x="40" y="330" width="230" height="120" rx="3" fill="none" stroke="#8a948f" stroke-dasharray="5 4"/>
      <text x="56" y="354" font-weight="600" fill="#5f6b69">First cluster</text>
      <text x="56" y="374" fill="#5f6b69" font-family="IBM Plex Mono, Menlo, monospace" font-size="11">router 0x7F0a…2D06</text>
      <text x="56" y="396" fill="#5f6b69">handed to the AlphaGrowth Safe</text>
      <text x="56" y="414" fill="#5f6b69">2026-11-09 · empty</text>
      <text x="56" y="432" fill="#5f6b69">nothing of ours on it</text>

      <!-- our cluster -->
      <rect x="320" y="30" width="570" height="620" rx="4" fill="none" stroke="#17201f" stroke-dasharray="6 4"/>
      <text x="336" y="54" font-weight="600">Our cluster</text>
      <text x="430" y="54" fill="#5f6b69">governor: our deployer key 0x5011…0253 · 33 checks ok</text>

      <rect x="350" y="80" width="230" height="80" rx="3" fill="#ffffff" stroke="#17201f"/>
      <text x="366" y="104" font-weight="600">shMON vault</text>
      <text x="470" y="104" fill="#5f6b69" font-family="IBM Plex Mono, Menlo, monospace" font-size="11">eshMON-6</text>
      <text x="366" y="126" fill="#5f6b69">collateral only</text>
      <text x="366" y="146" font-family="IBM Plex Mono, Menlo, monospace" font-size="11">0 shMON · cap 200M (~$4.9M)</text>

      <rect x="350" y="180" width="230" height="80" rx="3" fill="#ffffff" stroke="#17201f"/>
      <text x="366" y="204" font-weight="600">USDC vault</text>
      <text x="470" y="204" fill="#5f6b69" font-family="IBM Plex Mono, Menlo, monospace" font-size="11">eUSDC-26</text>
      <text x="366" y="226" fill="#5f6b69">LTV 79/80 shMON · 95/96 USDT0</text>
      <text x="366" y="246" font-family="IBM Plex Mono, Menlo, monospace" font-size="11">0 USDC · cap 5M, borrow 4.5M</text>

      <rect x="350" y="280" width="230" height="80" rx="3" fill="#ffffff" stroke="#17201f"/>
      <text x="366" y="304" font-weight="600">USDT0 vault</text>
      <text x="470" y="304" fill="#5f6b69" font-family="IBM Plex Mono, Menlo, monospace" font-size="11">eUSDT0-15</text>
      <text x="366" y="326" fill="#5f6b69">LTV 79/80 shMON · 95/96 USDC</text>
      <text x="366" y="346" font-family="IBM Plex Mono, Menlo, monospace" font-size="11">0 USDT0 · cap 5M, borrow 4.5M</text>

      <!-- the loan: drawn before the boxes so it passes behind them -->
      <path d="M465,400 V378 H1180 V488" fill="none" stroke="#0a7f6a" stroke-width="2" marker-end="url(#arrow-accent)"/>
      <line x1="1180" y1="378" x2="1180" y2="398" stroke="#0a7f6a" stroke-width="2" marker-end="url(#arrow-accent)"/>
      <text x="520" y="372" fill="#0a7f6a" font-size="11">lends WMON to each desk; the pool pays sellers with it</text>

      <rect x="350" y="400" width="230" height="134" rx="3" fill="#d9efe9" stroke="#0a7f6a" stroke-width="2"/>
      <text x="366" y="424" font-weight="600">WMON vault</text>
      <text x="470" y="424" fill="#5f6b69" font-family="IBM Plex Mono, Menlo, monospace" font-size="11">eWMON-16</text>
      <text x="366" y="446" fill="#5f6b69">LTV 97/98 shMON</text>
      <text x="366" y="464" fill="#5f6b69">LTV 93/95 ushMON</text>
      <text x="366" y="486" font-family="IBM Plex Mono, Menlo, monospace" font-size="11">929.88 WMON lent in (ours)</text>
      <text x="366" y="504" font-family="IBM Plex Mono, Menlo, monospace" font-size="11">0 borrowed · 20% at 0 use</text>
      <text x="366" y="522" font-family="IBM Plex Mono, Menlo, monospace" font-size="11">cap 727M, borrow 654M (~$10M)</text>

      <!-- the one ushMON vault -->
      <rect x="660" y="400" width="210" height="154" rx="3" fill="#ffffff" stroke="#17201f"/>
      <text x="676" y="424" font-weight="600">ushMON v4, one vault</text>
      <text x="676" y="444" font-family="IBM Plex Mono, Menlo, monospace" font-size="11">0xa753…8C5e</text>
      <text x="676" y="466" fill="#5f6b69">operators: both desks</text>
      <text x="676" y="484" fill="#5f6b69">each desk on its own ledger:</text>
      <text x="676" y="502" fill="#5f6b69">its unstakes, its WMON back</text>
      <text x="676" y="524" font-family="IBM Plex Mono, Menlo, monospace" font-size="11">48.38 shMON Delta One</text>
      <text x="676" y="542" font-family="IBM Plex Mono, Menlo, monospace" font-size="11">48.38 shMON Delta Neutral</text>

      <line x1="660" y1="477" x2="582" y2="477" stroke="#0a7f6a" stroke-width="2" marker-end="url(#arrow-accent)"/>
      <text x="621" y="465" fill="#0a7f6a" font-size="11" text-anchor="middle">collateral</text>

      <!-- sellers -->
      <rect x="960" y="200" width="300" height="64" rx="3" fill="#ffffff" stroke="#17201f"/>
      <text x="976" y="224" font-weight="600">Anyone holding shMON</text>
      <text x="976" y="244" fill="#5f6b69">sells into a pool, paid WMON at once</text>

      <line x1="1010" y1="264" x2="1010" y2="398" stroke="#17201f" marker-end="url(#arrow)"/>
      <text x="1020" y="312" fill="#5f6b69">shMON in</text>
      <text x="1020" y="330" fill="#5f6b69">WMON out, 0.30% under rate</text>
      <polyline points="1260,232 1286,232 1286,522 1262,522" fill="none" stroke="#17201f" marker-end="url(#arrow)"/>

      <!-- desks -->
      <rect x="960" y="400" width="300" height="64" rx="3" fill="#ffffff" stroke="#17201f"/>
      <text x="976" y="424" font-weight="600">Exit desk, Delta One</text>
      <text x="1130" y="424" fill="#5f6b69" font-family="IBM Plex Mono, Menlo, monospace" font-size="11">v1.10.0</text>
      <text x="976" y="444" font-family="IBM Plex Mono, Menlo, monospace" font-size="11">pool 0x56aE…28A8 · open</text>

      <rect x="960" y="490" width="300" height="64" rx="3" fill="#ffffff" stroke="#17201f"/>
      <text x="976" y="514" font-weight="600">Exit desk, Delta Neutral</text>
      <text x="1130" y="514" fill="#5f6b69" font-family="IBM Plex Mono, Menlo, monospace" font-size="11">v1.10.0</text>
      <text x="976" y="534" font-family="IBM Plex Mono, Menlo, monospace" font-size="11">pool 0x1924…e8a8 · open</text>

      <!-- each desk deposits the shMON its pool bought into the ushMON vault -->
      <line x1="960" y1="432" x2="872" y2="432" stroke="#17201f" marker-end="url(#arrow)"/>
      <line x1="960" y1="522" x2="872" y2="522" stroke="#17201f" marker-end="url(#arrow)"/>
      <text x="925" y="474" fill="#5f6b69" font-size="11" text-anchor="middle">shMON</text>
      <text x="925" y="489" fill="#5f6b69" font-size="11" text-anchor="middle">bought</text>

      <!-- shMonad -->
      <rect x="660" y="700" width="350" height="78" rx="3" fill="#ffffff" stroke="#17201f"/>
      <text x="676" y="724" font-weight="600">shMonad unstaking contract</text>
      <text x="676" y="742" fill="#5f6b69">Fastlane staking · the shMON token · the unstake queue</text>
      <text x="676" y="762" font-family="IBM Plex Mono, Menlo, monospace" font-size="11">0x1B68…E19c · 1 shMON = 1.6540 MON</text>

      <line x1="770" y1="554" x2="770" y2="698" stroke="#17201f" marker-end="url(#arrow)"/>
      <text x="782" y="672" fill="#5f6b69">each desk unstakes its own shMON</text>
      <text x="782" y="690" fill="#5f6b69">MON back in a day, credited to that desk</text>
    </g>
</svg>
